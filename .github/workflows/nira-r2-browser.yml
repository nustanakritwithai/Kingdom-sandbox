name: Nira R2 Browser UI Smoke
on:
  push:
    branches: [main]
    paths:
      - 'nira.html'
      - 'nira.js'
      - 'nira.css'
      - 'world/nira/**'
      - 'tests/nira-r2-browser.py'
      - '.github/workflows/nira-r2-browser.yml'
  pull_request:
    paths:
      - 'nira.html'
      - 'nira.js'
      - 'nira.css'
      - 'world/nira/**'
      - 'tests/nira-r2-browser.py'
      - '.github/workflows/nira-r2-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: R2 desktop / mobile / save migration smoke
        run: python tests/nira-r2-browser.py
      - name: Upload screenshots on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nira-r2-browser-screenshots
          path: artifacts/nira-r2-browser/
          if-no-files-found: ignore
