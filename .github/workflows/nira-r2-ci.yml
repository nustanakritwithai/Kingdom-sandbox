name: Nira R2 — Data and Living Society Gate
on:
  push:
    branches: [main, 'feat/nira-living-world-r2']
    paths:
      - 'nira.html'
      - 'nira.js'
      - 'nira.css'
      - 'world/nira/**'
      - 'tests/nira-*.mjs'
      - '.github/workflows/nira-r2-ci.yml'
  pull_request:
    paths:
      - 'nira.html'
      - 'nira.js'
      - 'nira.css'
      - 'world/nira/**'
      - 'tests/nira-*.mjs'
      - '.github/workflows/nira-r2-ci.yml'
permissions:
  contents: read
jobs:
  social-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check nira.js
      - run: node --check world/nira/living-world.mjs
      - run: node --check world/nira/social-world.mjs
      - run: node --test tests/nira-map-contract.test.mjs
      - run: node tests/nira-living-world.test.mjs
      - run: node tests/nira-social-world.test.mjs
      - run: node --test tests/nira-r2-verification.test.mjs
      - run: node tests/nira-r2-page-contract.test.mjs
